[project]
name = "vault-mcp"
version = "0.1.0"
description = "MCP server for the vault-experience plugin: search/record bugs, snippets, daily logs, ADRs to a local Obsidian vault."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.0",
    "python-frontmatter>=1.1",
]

[project.scripts]
vault-mcp = "vault_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vault_mcp"]
