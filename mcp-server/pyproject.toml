[project]
name = "memorant-mcp"
version = "0.1.0"
description = "MCP server for 书童 · Memorant: search and record development experience in a local Markdown knowledge base."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.0",
    "python-frontmatter>=1.1",
]

[project.scripts]
memorant-mcp = "memorant_mcp.server:main"
vault-mcp = "memorant_mcp.server:main"
memorant-hook = "memorant_mcp.hook_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memorant_mcp"]
